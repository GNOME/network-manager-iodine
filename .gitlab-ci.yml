variables:
    DEBIAN_DEPS:
        libnm-dev
        libnma-gtk4-dev
        intltool
        libgtk-4-dev
        libglib2.0-dev
        libsecret-1-dev
        autoconf
        automake
        libtool

build-debian:
  image: debian:forky
  stage: build
  before_script:
    - apt-get update
    - apt-get -y --no-install-recommends install $DEBIAN_DEPS
    - apt-get -y --no-install-recommends install build-essential
  script:
    - ./autogen.sh
    - make

